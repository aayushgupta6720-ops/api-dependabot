<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>api-dependabot dashboard</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.4;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  .subtitle { margin-top: 0; opacity: 0.75; font-size: 0.9rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #8884; padding-bottom: 0.3rem; }
  .status-strip {
    display: flex;
    gap: 2rem;
    padding: 0.75rem 1rem;
    background: #8881;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .status-strip div span { display: block; font-size: 0.75rem; opacity: 0.7; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #8883; vertical-align: top; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; margin: 0.1rem 0.2rem 0.1rem 0; }
  .badge-ok { background: #1a7f3722; color: #1a7f37; }
  .badge-skip { background: #6e768122; color: #6e7681; }
  .badge-error { background: #cf222e22; color: #cf222e; }
  .empty { opacity: 0.6; font-style: italic; padding: 1rem 0; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>api-dependabot dashboard</h1>
  <p class="subtitle">Runs of an agent that reads an SDK's release notes for breaking changes and opens pull requests that patch the code using it. <a href="https://github.com/aayushgupta6720-ops/api-dependabot">Source on GitHub</a></p>

  <div class="status-strip" id="status">Loading...</div>

  <h2>Runs</h2>
  <div id="runs" class="empty">Loading...</div>

  <h2>Eval history</h2>
  <div id="evals" class="empty">Loading...</div>

<script type="module">
  // Relative URLs: the static copy (src/dashboard/build.ts) is served under a
  // subpath on GitHub Pages, not at the root.
  import { renderEvals, renderRuns, renderStatus } from "./render.js";

  async function load(id, path, render) {
    const el = document.getElementById(id);
    const data = await fetch(path).then((r) => r.json());
    if (Array.isArray(data)) el.className = data.length === 0 ? "empty" : "";  // the run and eval lists
    el.innerHTML = render(data);
  }

  load("status", "api/status.json", renderStatus);
  load("runs", "api/runs.json", renderRuns);
  load("evals", "api/evals.json", renderEvals);
</script>
</body>
</html>
